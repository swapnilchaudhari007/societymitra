name: 🐛 Bug report
description: Report something broken in SocietyMitra
title: '[Bug]: '
labels:
- bug
body:
- type: input
  id: area
  attributes:
    label: Affected area
    description: e.g. Agent / reasoning, Knowledge base (bye-laws, notices), Web search (Tavily)
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: What did you expect, and what happened instead?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: "1. \n2. \n3. "
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Logs or screenshots
    description: Remove keys, tokens and personal data first.
    render: shell
